services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      # Postgres 18 async I/O aktif default; io_method di-set eksplisit untuk kejelasan.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: postgres -c io_method=worker
    # PG18+ official image: mount di /var/lib/postgresql (bukan .../data)
    volumes:
      - pgdata:/var/lib/postgresql
    # Tanpa binding host: app akses via network internal compose.
    # (host 5432/6379 sering sudah terpakai di mesin dev)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking"]
      interval: 3s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8
    # AOF WAJIB: melindungi task asynq dari hilang saat restart (desain §6.3).
    # Tidak ada maxmemory-policy allkeys-lru → default noeviction menjaga task queue.
    command: valkey-server --appendonly yes --appendfsync everysec
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  migration:
    build: .
    entrypoint: ["migrate", "-dir=/migrations", "up"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-dev}@postgres:5432/booking?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-dev}@postgres:5432/booking?sslmode=disable}
      VALKEY_ADDR: ${VALKEY_ADDR:-valkey:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      HOLD_TIMEOUT: ${HOLD_TIMEOUT:-30m}
      FAKE_PAY_BASE_URL: ${FAKE_PAY_BASE_URL:-http://localhost:18080}   # agar payment_url bisa dibuka dari host
      # Penyedia Eksternal (otomatis membaca dari file .env jika disediakan, default aman tanpa rahasia)
      XENDIT_BASE_URL: ${XENDIT_BASE_URL:-https://api.xendit.co}
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY:-}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN:-}
      RESEND_BASE_URL: ${RESEND_BASE_URL:-https://api.resend.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-log}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL:-}
      WHATSAPP_ACCOUNT_SID: ${WHATSAPP_ACCOUNT_SID:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_FROM_PHONE: ${WHATSAPP_FROM_PHONE:-+6281234567890}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "18080:8080"   # host 8080 sering terpakai; app tetap listen di 8080 internal

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/varz"]
      interval: 3s
      timeout: 3s
      retries: 10

  asynqmon:
    image: hibiken/asynqmon
    environment:
      REDIS_ADDR: valkey:6379
    ports:
      - "8081:8080"
    depends_on:
      - valkey

volumes:
  pgdata:
  valkeydata:
  natsdata:

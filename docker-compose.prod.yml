services:
  # ---------------------------------------------------------------------------
  # Database  : Neon Postgres (eksternal)  -> DATABASE_URL di .env
  # Cache/Queue: Redis Cloud (eksternal)   -> REDIS_URL di .env
  # Message Bus: NATS (lokal container)
  # ---------------------------------------------------------------------------

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - natsdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/varz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Menjalankan migrasi Goose ke Neon Postgres (restart: no)
  migration:
    image: ghcr.io/mufied-n/hotel-be:latest
    entrypoint: ["migrate", "-dir=/migrations", "up"]
    env_file:
      - .env
    restart: "no"

  app:
    image: ghcr.io/mufied-n/hotel-be:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: "8080"
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  natsdata:
